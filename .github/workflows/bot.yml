name: Automatizar Asistencia

on:
  workflow_dispatch:  # Permite activarlo mediante la API de GitHub

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Script
        env:
          ASISTENCIA_USER: ${{ secrets.ASISTENCIA_USER }}
          ASISTENCIA_PASSWORD: ${{ secrets.ASISTENCIA_PASSWORD }}
        run: python asistencia.py
